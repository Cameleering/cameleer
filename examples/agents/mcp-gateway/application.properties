# The gateway's own MCP server: Streamable HTTP on http://127.0.0.1:18191/mcp, serving the
# imported shop tools (tag mcp:shop) and the local support tools.
camel.server.port=18191
camel.server.host=127.0.0.1
camel.server.mcp-enabled=true
camel.server.mcp-tags=mcp:*,support
camel.server.mcp-server-name=acme-gateway
camel.server.mcp-instructions=One endpoint for the Acme Outdoor support team: shop_* tools read the shop's back office (customers, orders, shipments, stock, tickets, policies); support_hours gives the team's hours. All amounts are in pounds sterling (GBP).

# The shop, started by the gateway over stdio (paths relative to this directory)
camel.ai.mcp.shop.command=cameleer
camel.ai.mcp.shop.args=run,../mcp-shop/shop.camel.yaml,--properties,../mcp-shop/application.properties,--prop,acme.dir=../mcp-shop,--prop,camel.server.port=0,--mcp-stdio
camel.ai.mcp.shop.toolPrefix=shop_
# import only what reads: refunds, cancellations, emails and other changes stay out
camel.ai.mcp.shop.include=search_*,get_*,list_*,track_shipment,check_inventory,sales_report,read_document
# the gateway's rules on every imported tool
camel.ai.mcp.shop.rateLimit=60
camel.ai.mcp.shop.rateLimitPeriod=1m
camel.ai.mcp.shop.cacheTtl=30s
