# Apache Camel on Quarkus, native side of the Cameleer benchmark. Defaults everywhere except what
# the shared routes need. The datasource connects lazily, so scenarios without SQL never open it.
quarkus.banner.enabled=false
quarkus.devservices.enabled=false
quarkus.log.console.stderr=true

# http-sql: PostgreSQL on the load node, a pool of 16 like the other sides (PG_POOL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${BENCH_PG:127.0.0.1}:5432/bench
quarkus.datasource.username=camel
quarkus.datasource.password=camelpw
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.initial-size=0
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.health.enabled=false
