[package]
name = "camel-main"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["camel", "integration", "cli", "yaml", "serverless"]
categories = ["command-line-utilities", "network-programming"]
description = "rust-camel main runner and `camel` CLI (like Camel Main / Camel JBang)"

[dependencies]
camel-amqp = { path = "../camel-amqp" }
camel-amqp10 = { path = "../camel-amqp10" }
camel-cloud = { path = "../camel-cloud" }
camel-core = { path = "../camel-core" }
camel-dataformats = { path = "../camel-dataformats" }
camel-datastores = { path = "../camel-datastores" }
camel-grpc = { path = "../camel-grpc" }
camel-http = { path = "../camel-http" }
camel-protocols = { path = "../camel-protocols" }
camel-script = { path = "../camel-script" }
camel-soap = { path = "../camel-soap" }
camel-saas = { path = "../camel-saas" }
camel-kafka-mqtt = { path = "../camel-kafka-mqtt" }
camel-sql = { path = "../camel-sql" }
camel-ssh = { path = "../camel-ssh" }
camel-xml = { path = "../camel-xml" }
camel-yaml = { path = "../camel-yaml" }

[[bin]]
name = "camel"
path = "src/bin/camel.rs"
