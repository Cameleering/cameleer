[package]
name = "cameleer-dicom"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["camel", "dicom", "dicomweb", "healthcare", "integration"]
categories = ["encoding", "network-programming"]
description = "Cameleer DICOM (std only): Part 10 files and data sets, the PS3.6 data dictionary, specific character sets, the dicom and dicomJson data formats, Simple access to tags, the dicom component (DIMSE SCU and SCP over TCP and TLS), the dicomweb component (QIDO-RS, WADO-RS, STOW-RS client and server) and PS3.15 Annex E de-identification"

[dependencies]
cameleer-core = { path = "../cameleer-core", version = "0.5.1", default-features = false }
cameleer-http = { path = "../cameleer-http", version = "0.5.1", default-features = false }
cameleer-tls = { path = "../cameleer-tls", version = "0.5.1" }
cameleer-ai = { path = "../cameleer-ai", version = "0.5.1" }

[dev-dependencies]
cameleer-core = { path = "../cameleer-core" }
cameleer-http = { path = "../cameleer-http" }
