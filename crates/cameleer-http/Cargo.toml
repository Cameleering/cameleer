[package]
name = "cameleer-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["camel", "http", "rest", "websocket", "integration"]
categories = ["web-programming::http-server", "web-programming::http-client", "network-programming"]
description = "Cameleer HTTP/1.1 server and client, http/platform-http components, REST DSL and netty (tcp/udp)"

[dependencies]
cameleer-core = { path = "../cameleer-core", version = "0.6.0", default-features = false }
cameleer-tls = { path = "../cameleer-tls", version = "0.6.0" }
cameleer-grpc = { path = "../cameleer-grpc", version = "0.6.0", default-features = false, optional = true }
# The HTTP server engine (docs/design/simoom-adoption.md): an event loop per core, HTTP/1.1 and TLS.
simoom = { version = "0.1.0", default-features = false, features = ["http1", "tls", "tls-extra", "guard", "idle-trim"] }
# TLS 1.2 next to 1.3, as the server has always offered
simoom-tls = { version = "0.1.0", default-features = false, features = ["tls12", "rsa", "p384", "ed25519", "chacha20"] }

# `http2`: the http producer's `httpVersion=HTTP/2` (cameleer-grpc's HTTP/2 client). On by
# default and in cameleer-main's `full`; without it that option fails with the feature to enable.
[features]
default = ["http2"]
http2 = ["dep:cameleer-grpc"]

[dev-dependencies]
# the tests use every optional part of core/http (their default features); the library does not
cameleer-core = { path = "../cameleer-core" }
