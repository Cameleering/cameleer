[package]
name = "cameleer-main"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["camel", "integration", "cli", "mcp", "serverless"]
categories = ["command-line-utilities", "network-programming"]
description = "Cameleer main runner and `cameleer` CLI (like Camel Main / Camel JBang): runs Camel YAML, XML and Rust routes, serves routes as MCP tools (--mcp, --mcp-stdio), validates, tests, and runs as an AWS Lambda custom runtime"

[dependencies]
cameleer-ai = { path = "../cameleer-ai", version = "0.6.0", optional = true }
cameleer-amqp = { path = "../cameleer-amqp", version = "0.6.0", optional = true }
cameleer-attest = { path = "../cameleer-attest", version = "0.6.0", optional = true }
cameleer-amqp10 = { path = "../cameleer-amqp10", version = "0.6.0", optional = true }
cameleer-cloud = { path = "../cameleer-cloud", version = "0.6.0", optional = true }
cameleer-core = { path = "../cameleer-core", version = "0.6.0", default-features = false }
cameleer-dataformats = { path = "../cameleer-dataformats", version = "0.6.0", optional = true }
cameleer-datastores = { path = "../cameleer-datastores", version = "0.6.0", optional = true }
# packs: optional, not in `full` (docs/design/packs/domain-packs.md)
cameleer-health = { path = "../cameleer-health", version = "0.6.0", optional = true }
cameleer-grpc = { path = "../cameleer-grpc", version = "0.6.0", optional = true }
cameleer-http = { path = "../cameleer-http", version = "0.6.0", default-features = false }
cameleer-protocols = { path = "../cameleer-protocols", version = "0.6.0", optional = true }
cameleer-script = { path = "../cameleer-script", version = "0.6.0", optional = true }
cameleer-soap = { path = "../cameleer-soap", version = "0.6.0", optional = true }
cameleer-saas = { path = "../cameleer-saas", version = "0.6.0", optional = true }
cameleer-kafka-mqtt = { path = "../cameleer-kafka-mqtt", version = "0.6.0", optional = true }
cameleer-sql = { path = "../cameleer-sql", version = "0.6.0", optional = true }
cameleer-ssh = { path = "../cameleer-ssh", version = "0.6.0", optional = true }
cameleer-xml = { path = "../cameleer-xml", version = "0.6.0", optional = true }
cameleer-yaml = { path = "../cameleer-yaml", version = "0.6.0", default-features = false }

# Component families. The default build has all of them; a FaaS or edge build picks only
# what its routes use, e.g.
#   cargo build --profile dist -p cameleer-main --no-default-features --features cloud
# Always included: core (EIPs, Simple, JsonPath and the other core languages, core components),
# YAML/XML DSL, HTTP/1.1 (platform-http, http, rest, netty) and TLS. A route that names a
# component or language left out of the build fails at startup with a message naming the feature
# to enable. Besides the component families: `templates` (mustache, velocity, freemarker,
# string-template), `jq`, `xpath` (the core XPath subset; the `xml` family has the full XPath),
# `http2` (`httpVersion=HTTP/2` of the http producer) and `validate` (`cameleer validate` and
# `cameleer schema`).
[features]
default = ["full"]
# nothing optional: `--no-default-features --features core` (or `FEATURES=core` for the image)
core = []
full = [
    "ai", "amqp", "amqp10", "attest", "cloud", "dataformats", "datastores", "grpc", "kafka-mqtt", "protocols", "saas", "script", "soap", "sql", "ssh", "xml",
    "templates", "jq", "xpath", "http2", "validate",
]
templates = ["cameleer-core/templates"]
jq = ["cameleer-core/jq"]
xpath = ["cameleer-core/xpath"]
http2 = ["cameleer-http/http2"]
validate = []
# The health pack (HL7 v2 and MLLP, FHIR, DICOM): `--features health`; deliberately not in `full`.
health = ["dep:cameleer-health"]
ai = ["dep:cameleer-ai", "cameleer-yaml/agent"]
# attestation in hardware TEEs (camel.attestation.*): configfs-tsm and dstack evidence
attest = ["dep:cameleer-attest"]
amqp = ["dep:cameleer-amqp"]
amqp10 = ["dep:cameleer-amqp10"]
cloud = ["dep:cameleer-cloud", "cameleer-yaml/agent"]
dataformats = ["dep:cameleer-dataformats"]
datastores = ["dep:cameleer-datastores"]
grpc = ["dep:cameleer-grpc"]
kafka-mqtt = ["dep:cameleer-kafka-mqtt"]
protocols = ["dep:cameleer-protocols"]
saas = ["dep:cameleer-saas", "cameleer-yaml/agent"]
script = ["dep:cameleer-script"]
soap = ["dep:cameleer-soap"]
sql = ["dep:cameleer-sql"]
ssh = ["dep:cameleer-ssh"]
xml = ["dep:cameleer-xml"]

[[bin]]
name = "cameleer"
path = "src/bin/cameleer.rs"

[[example]]
name = "embed_yaml"
required-features = ["full"]


[[example]]
name = "idle_threads"
required-features = ["xml"]

[dev-dependencies]
# the tests check the pack tables and run the health pages and examples with the pack added
cameleer-health = { path = "../cameleer-health" }
# test certificates (cameleer_tls::testing) for the HTTPS tests
cameleer-tls = { path = "../cameleer-tls" }
