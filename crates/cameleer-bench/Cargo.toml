[package]
name = "cameleer-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["camel", "benchmark"]
categories = ["development-tools::profiling"]
description = "Benchmark harness comparing Cameleer with Apache Camel (std-only, no criterion)"
publish = false

[dependencies]
cameleer-ai = { path = "../cameleer-ai", version = "0.8.0" }
cameleer-core = { path = "../cameleer-core", version = "0.8.0" }
cameleer-grpc = { path = "../cameleer-grpc", version = "0.8.0" }
cameleer-http = { path = "../cameleer-http", version = "0.8.0" }
cameleer-kafka-mqtt = { path = "../cameleer-kafka-mqtt", version = "0.8.0" }
cameleer-opentelemetry = { path = "../cameleer-opentelemetry", version = "0.8.0" }
cameleer-sql = { path = "../cameleer-sql", version = "0.8.0" }
# the HTTP/2 load generator of the rest-json-h2 scenario
simoom-client = { version = "0.2", default-features = false, features = ["client-h2"] }

[[bin]]
name = "cameleer-bench"
path = "src/main.rs"
