[package]
name = "camel-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rust-camel cloud components (std only): AWS (S3, SQS, SNS, DynamoDB + Streams, Lambda, Kinesis, Firehose, EventBridge, Secrets Manager, SES, CloudWatch, STS, Step Functions, IAM, EC2, MSK + Kafka AWS_MSK_IAM, Athena, Textract, Translate, Comprehend, Polly, Rekognition, Transcribe, Bedrock, MQ, ECS, EKS, KMS, Timestream, CloudTrail, Config, Redshift Data), Azure (Blob, Queue, Data Lake, Files, Key Vault, Cosmos DB, Functions, Event Grid, Schema Registry, OpenAI) and Google Cloud (Storage, Pub/Sub incl. gRPC streaming pull, BigQuery, Secret Manager, Functions, Firestore, Sheets, Gmail, Calendar, Drive (+ streaming consumers), Vertex AI, Speech-to-Text, Text-to-Speech) over their REST / gRPC APIs, with embedded verifying emulators"

[dependencies]
camel-core = { path = "../camel-core" }
camel-tls = { path = "../camel-tls" }
camel-grpc = { path = "../camel-grpc" }
camel-kafka-mqtt = { path = "../camel-kafka-mqtt" }
camel-dataformats = { path = "../camel-dataformats" }
camel-amqp10 = { path = "../camel-amqp10" }
