[package]
name = "cameleer-yaml"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["camel", "yaml", "dsl", "routes", "integration"]
categories = ["parser-implementations", "config"]
description = "YAML 1.2 parser/emitter and the Camel YAML (and XML) route DSL loader for Cameleer"

[dependencies]
cameleer-core = { path = "../cameleer-core", version = "0.6.0", default-features = false }

[features]
default = ["agent"]
# the `agent` step (needs cameleer-core's AI core)
agent = ["cameleer-core/agent"]

[dev-dependencies]
# the tests use every optional part of core/http (their default features); the library does not
cameleer-core = { path = "../cameleer-core" }
