[package]
name = "cameleer-xml"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["camel", "xml", "xpath", "xslt", "xquery"]
categories = ["parser-implementations", "text-processing"]
description = "Cameleer XML stack (std only): XML 1.0 parser + DOM, XPath 1.0, XQuery 1.0, XSLT 1.0 (xslt/xslt-saxon components), XML Schema validation (validator component), xj, xmlsecurity"

[dependencies]
cameleer-core = { path = "../cameleer-core", version = "0.5.0", default-features = false }
cameleer-tls = { path = "../cameleer-tls", version = "0.5.0" }

[dev-dependencies]
# the tests use every optional part of core/http (their default features); the library does not
cameleer-core = { path = "../cameleer-core" }
