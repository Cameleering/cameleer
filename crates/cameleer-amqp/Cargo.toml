[package]
name = "cameleer-amqp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["camel", "amqp", "rabbitmq", "stomp", "jms"]
categories = ["network-programming"]
description = "Cameleer messaging components (std only): AMQP 0-9-1 (rabbitmq, spring-rabbitmq), STOMP 1.2 (stomp) and JMS-style jms/activemq/amqp over STOMP"

[dependencies]
cameleer-core = { path = "../cameleer-core", version = "0.3.0", default-features = false }
cameleer-tls = { path = "../cameleer-tls", version = "0.3.0" }

[dev-dependencies]
# the tests use every optional part of core/http (their default features); the library does not
cameleer-core = { path = "../cameleer-core" }
