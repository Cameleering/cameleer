[package]
name = "cameleer-kafka-mqtt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["camel", "kafka", "mqtt", "messaging", "iot"]
categories = ["network-programming", "embedded"]
description = "Cameleer messaging components (std only): kafka (wire protocol client) and paho / paho-mqtt5 (MQTT 3.1.1 / 5.0), with embedded test brokers"

[dependencies]
cameleer-core = { path = "../cameleer-core", version = "0.6.1", default-features = false }
cameleer-tls = { path = "../cameleer-tls", version = "0.6.1" }

[dev-dependencies]
# the tests use every optional part of core/http (their default features); the library does not
cameleer-core = { path = "../cameleer-core" }
