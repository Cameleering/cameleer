[package]
name = "cameleer-protocols"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["camel", "ftp", "smtp", "mllp", "syslog"]
categories = ["network-programming", "email"]
description = "Cameleer network protocol components (std only): ftp, smtp/pop3/imap, websocket, mllp/hl7, syslog"

[dependencies]
cameleer-core = { path = "../cameleer-core", version = "0.5.0", default-features = false }
cameleer-tls = { path = "../cameleer-tls", version = "0.5.0" }

[dev-dependencies]
# the tests use every optional part of core/http (their default features); the library does not
cameleer-core = { path = "../cameleer-core" }
