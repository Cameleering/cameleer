[package]
name = "cameleer-sql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["camel", "sql", "postgresql", "jdbc", "integration"]
categories = ["database", "network-programming"]
description = "Cameleer SQL support (std only): DataSource SPI, embedded rustsql engine, PostgreSQL wire client, sql/jdbc components, JDBC repositories"

[dependencies]
cameleer-core = { path = "../cameleer-core", version = "0.6.1", default-features = false }
cameleer-tls = { path = "../cameleer-tls", version = "0.6.1" }

[dev-dependencies]
# the tests use every optional part of core/http (their default features); the library does not
cameleer-core = { path = "../cameleer-core" }
