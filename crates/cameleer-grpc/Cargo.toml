[package]
name = "cameleer-grpc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["camel", "grpc", "protobuf", "http2", "integration"]
categories = ["network-programming", "encoding"]
description = "Cameleer HTTP/2 (RFC 9113 + HPACK), Protocol Buffers (.proto parser, dynamic codec, protobuf data format) and the gRPC component"

[dependencies]
cameleer-core = { path = "../cameleer-core", version = "0.5.1", default-features = false }
cameleer-tls = { path = "../cameleer-tls", version = "0.5.1" }

[dev-dependencies]
# the tests use every optional part of core/http (their default features); the library does not
cameleer-core = { path = "../cameleer-core" }
