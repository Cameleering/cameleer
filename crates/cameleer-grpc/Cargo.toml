[package]
name = "cameleer-grpc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["camel", "grpc", "protobuf", "http2", "integration"]
categories = ["network-programming", "encoding"]
description = "Cameleer HTTP/2 (RFC 9113 + HPACK), Protocol Buffers (.proto parser, dynamic codec, protobuf data format) and the gRPC component"

[dependencies]
cameleer-core = { path = "../cameleer-core", version = "0.6.1", default-features = false }
cameleer-tls = { path = "../cameleer-tls", version = "0.6.1" }
# The TLS bridge of the HTTP client (trust anchors, client certificates), shared with the gRPC client
cameleer-http = { path = "../cameleer-http", version = "0.6.1", default-features = false }
# The gRPC client: full-duplex HTTP/2 calls (docs/design/simoom-adoption.md)
simoom-client = { version = "0.1.0", default-features = false, features = ["client-h2", "h2c-upgrade", "tls", "tls-extra"] }

[dev-dependencies]
# the tests use every optional part of core/http (their default features); the library does not
cameleer-core = { path = "../cameleer-core" }
