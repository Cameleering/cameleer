[package]
name = "cameleer-soap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["camel", "soap", "fhir", "jaxb", "integration"]
categories = ["web-programming", "encoding"]
description = "Cameleer SOAP stack (std only): WSDL 1.1, SOAP 1.1/1.2 envelopes and faults, WS-Security, cxf / cxfrs / spring-ws components, the jaxb data format, FHIR R4 (fhirJson / fhirXml data formats, fhir component, mock server)"

[dependencies]
cameleer-core = { path = "../cameleer-core", version = "0.3.0", default-features = false }
cameleer-http = { path = "../cameleer-http", version = "0.3.0", default-features = false }
cameleer-tls = { path = "../cameleer-tls", version = "0.3.0" }
cameleer-xml = { path = "../cameleer-xml", version = "0.3.0" }

[dev-dependencies]
# the tests use every optional part of core/http (their default features); the library does not
cameleer-core = { path = "../cameleer-core" }
cameleer-http = { path = "../cameleer-http" }
