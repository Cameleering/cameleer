[package]
name = "cameleer-saas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["camel", "llm", "openai", "slack", "integration"]
categories = ["api-bindings", "web-programming::http-client"]
description = "Cameleer SaaS / API connectors over REST (std only): slack, telegram, github, twilio, jira, openai (and 19 compatible providers), anthropic, gemini, webhook, graphql, rss/atom, with embedded mock servers"

[dependencies]
cameleer-core = { path = "../cameleer-core", version = "0.5.1", default-features = false, features = ["agent"] }
cameleer-http = { path = "../cameleer-http", version = "0.5.1", default-features = false }
cameleer-xml = { path = "../cameleer-xml", version = "0.5.1" }

[dev-dependencies]
# the tests use every optional part of core/http (their default features); the library does not
cameleer-core = { path = "../cameleer-core" }
cameleer-http = { path = "../cameleer-http" }
