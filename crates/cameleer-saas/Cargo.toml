[package]
name = "cameleer-saas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["camel", "openai", "slack", "github", "integration"]
categories = ["api-bindings", "web-programming::http-client"]
description = "Cameleer SaaS / API connectors over REST (std only): slack, telegram, github, twilio, jira, openai, webhook, graphql, rss/atom, with embedded mock servers"

[dependencies]
cameleer-core = { path = "../cameleer-core", version = "0.4.0", default-features = false }
cameleer-http = { path = "../cameleer-http", version = "0.4.0", default-features = false }
cameleer-xml = { path = "../cameleer-xml", version = "0.4.0" }

[dev-dependencies]
# the tests use every optional part of core/http (their default features); the library does not
cameleer-core = { path = "../cameleer-core" }
cameleer-http = { path = "../cameleer-http" }
