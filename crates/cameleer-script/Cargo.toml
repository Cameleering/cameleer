[package]
name = "cameleer-script"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["camel", "groovy", "javascript", "python", "interpreter"]
categories = ["development-tools", "parser-implementations"]
description = "Cameleer scripting languages: JavaScript, Groovy, Python, OGNL, MVEL, SpEL, DataSonnet (tree-walking interpreters)"

[dependencies]
cameleer-core = { path = "../cameleer-core", version = "0.5.1", default-features = false }
cameleer-tls = { path = "../cameleer-tls", version = "0.5.1" }

[dev-dependencies]
# the tests use every optional part of core/http (their default features); the library does not
cameleer-core = { path = "../cameleer-core" }
cameleer-yaml = { path = "../cameleer-yaml" }
