[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pmsudhi/cameleer"
homepage = "https://pmsudhi.github.io/cameleer/"
documentation = "https://pmsudhi.github.io/cameleer/docs/"
authors = ["Sudheesh PM <pmsudhi@gmail.com>"]
readme = "README.md"

# The from-scratch cryptography (constant-time bitsliced AES, bignum RSA/ECC) is far too
# slow unoptimized; optimize it even in dev/test builds.
[profile.dev.package.cameleer-tls]
opt-level = 2

# Release binaries (CLI, container image, Lambda zip): whole-program (fat) LTO and one
# codegen unit, at the cost of a longer build; `cargo build --release` and the tests keep the
# default profile. Fat LTO measured faster than thin (splitagg +6-8%) with 25% less peak RSS,
# for a binary about 8% larger (benchmarks/analysis.md, fourth round). `opt-level = "s"` was
# 13% smaller but 10-19% slower, so it is not used. `panic = "abort"` is not possible: the
# executor and the HTTP server catch panics in routes.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
