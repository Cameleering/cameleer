[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pmsudhi/Rust-camel"
homepage = "https://pmsudhi.github.io/Rust-camel/"
authors = ["Sudheesh PM <pmsudhi@gmail.com>"]

# The from-scratch cryptography (constant-time bitsliced AES, bignum RSA/ECC) is far too
# slow unoptimized; optimize it even in dev/test builds.
[profile.dev.package.camel-tls]
opt-level = 2
