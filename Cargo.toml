[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pmsudhi/cameleer"
homepage = "https://pmsudhi.github.io/cameleer/"
documentation = "https://pmsudhi.github.io/cameleer/docs/"
authors = ["Sudheesh PM <pmsudhi@gmail.com>"]
readme = "README.md"

# The from-scratch cryptography (constant-time bitsliced AES, bignum RSA/ECC) is far too
# slow unoptimized; optimize it even in dev/test builds.
[profile.dev.package.cameleer-tls]
opt-level = 2

# Release binaries (CLI, container image): cross-crate inlining and one codegen unit make
# a smaller, faster binary at the cost of a longer build; `cargo build --release` and the
# tests keep the default profile. `panic = "abort"` is not possible: the executor and the
# HTTP server catch panics in routes.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
