# The tools, resources and prompts the official MCP conformance suite calls, as Cameleer routes
# (scripts/mcp-conformance.sh serves them with `cameleer run --mcp`).
- route:
    from:
      uri: ai-tool:test_simple_text
      parameters:
        description: Returns simple text
        readOnlyHint: true
      steps:
        - setBody:
            constant: This is a simple text response for testing.
- route:
    from:
      uri: ai-tool:test_error_handling
      parameters:
        description: Always fails
        readOnlyHint: true
      steps:
        - throwException:
            exceptionType: java.lang.IllegalStateException
            message: This tool intentionally returns an error for testing
- route:
    from:
      uri: ai-tool:test_image_content
      parameters:
        description: Returns an image
        readOnlyHint: true
      steps:
        - setHeader:
            name: CamelAiToolContent
            constant: '[{"type":"image","mimeType":"image/png","data":"iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFBQIAX8jx0gAAAABJRU5ErkJggg=="}]'
- route:
    from:
      uri: ai-tool:test_audio_content
      parameters:
        description: Returns audio
        readOnlyHint: true
      steps:
        - setHeader:
            name: CamelAiToolContent
            constant: '[{"type":"audio","mimeType":"audio/wav","data":"UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="}]'
- route:
    from:
      uri: ai-tool:test_embedded_resource
      parameters:
        description: Returns an embedded resource
        readOnlyHint: true
      steps:
        - setHeader:
            name: CamelAiToolContent
            constant: '[{"type":"resource","resource":{"uri":"test://embedded-resource","mimeType":"text/plain","text":"This is an embedded resource content."}}]'
- route:
    from:
      uri: ai-tool:test_multiple_content_types
      parameters:
        description: Returns text, an image and a resource
        readOnlyHint: true
      steps:
        - setHeader:
            name: CamelAiToolContent
            constant: '[{"type":"text","text":"Multiple content types test:"},{"type":"image","mimeType":"image/png","data":"iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFBQIAX8jx0gAAAABJRU5ErkJggg=="},{"type":"resource","resource":{"uri":"test://mixed-content-resource","mimeType":"application/json","text":"{\"test\":\"data\",\"value\":123}"}}]'
- route:
    from:
      uri: ai-resource:static-text
      parameters:
        uri: test://static-text
        mimeType: text/plain
      steps:
        - setBody:
            constant: This is the content of the static text resource.
- route:
    from:
      uri: ai-resource:static-binary
      parameters:
        uri: test://static-binary
        mimeType: image/png
      steps:
        - setBody:
            constant: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFBQIAX8jx0gAAAABJRU5ErkJggg==
        - unmarshal:
            base64: {}
- route:
    from:
      uri: ai-resource:template
      parameters:
        uri: "test://template/{id}/data"
        mimeType: application/json
      steps:
        - setBody:
            simple: '{"id":"${header.id}","templateTest":true,"data":"Data for ID: ${header.id}"}'
- route:
    from:
      uri: ai-resource:watched
      parameters:
        uri: test://watched-resource
      steps:
        - setBody:
            constant: watched
- route:
    from:
      uri: ai-prompt:test_simple_prompt
      parameters:
        description: A simple prompt
      steps:
        - setBody:
            constant: This is a simple prompt for testing.
- route:
    from:
      uri: ai-prompt:test_prompt_with_arguments
      parameters:
        description: A prompt with arguments
        argument.arg1.description: First test argument
        argument.arg1.required: true
        argument.arg1.values: paris,park,party
        argument.arg2.description: Second test argument
        argument.arg2.required: true
      steps:
        - setBody:
            simple: "Prompt with arguments: arg1='${header.arg1}', arg2='${header.arg2}'"
- route:
    from:
      uri: ai-prompt:test_prompt_with_embedded_resource
      parameters:
        description: A prompt with an embedded resource
        argument.resourceUri.required: true
      steps:
        - setBody:
            simple: '[{"role":"user","content":{"type":"resource","resource":{"uri":"${header.resourceUri}","mimeType":"text/plain","text":"Embedded resource content for testing."}}},{"role":"user","content":{"type":"text","text":"Please process the embedded resource above."}}]'
        - unmarshal:
            json: {}
- route:
    from:
      uri: ai-prompt:test_prompt_with_image
      parameters:
        description: A prompt with an image
      steps:
        - setBody:
            constant: '[{"role":"user","content":{"type":"image","mimeType":"image/png","data":"iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFBQIAX8jx0gAAAABJRU5ErkJggg=="}},{"role":"user","content":{"type":"text","text":"Please analyze the image above."}}]'
        - unmarshal:
            json: {}
- route:
    from:
      uri: ai-tool:test_tool_with_logging
      parameters:
        description: Sends three log messages
        readOnlyHint: true
      steps:
        - setHeader: {name: CamelAiToolLogLevel, constant: info}
        - setBody: {constant: Tool execution started}
        - to: ai-tool:current?operation=log
        - delay: {constant: 50}
        - setBody: {constant: Tool processing data}
        - to: ai-tool:current?operation=log
        - delay: {constant: 50}
        - setBody: {constant: Tool execution completed}
        - to: ai-tool:current?operation=log
        - setBody: {constant: Logging test completed}
- route:
    from:
      uri: ai-tool:test_tool_with_progress
      parameters:
        description: Reports progress
        readOnlyHint: true
      steps:
        - setHeader: {name: CamelAiToolProgressTotal, constant: 100}
        - setHeader: {name: CamelAiToolProgress, constant: 0}
        - to: ai-tool:current?operation=progress
        - delay: {constant: 50}
        - setHeader: {name: CamelAiToolProgress, constant: 50}
        - to: ai-tool:current?operation=progress
        - delay: {constant: 50}
        - setHeader: {name: CamelAiToolProgress, constant: 100}
        - to: ai-tool:current?operation=progress
        - setBody: {constant: Progress test completed}
- route:
    from:
      uri: ai-tool:test_sampling
      parameters:
        description: Asks the client's model
        parameter.prompt: string
        parameter.prompt.required: true
        readOnlyHint: true
      steps:
        - setHeader: {name: CamelAiToolSampleMaxTokens, constant: 100}
        - setBody: {simple: "${header.prompt}"}
        - to: ai-tool:current?operation=sample
        - setBody: {simple: "LLM response: ${body}"}
- route:
    from:
      uri: ai-tool:test_elicitation
      parameters:
        description: Asks the user
        parameter.message: string
        parameter.message.required: true
        readOnlyHint: true
      steps:
        - setHeader:
            name: CamelAiToolElicitSchema
            constant: '{"type":"object","properties":{"username":{"type":"string","description":"User''s response"},"email":{"type":"string","description":"User''s email address"}},"required":["username","email"]}'
        - setBody: {simple: "${header.message}"}
        - to: ai-tool:current?operation=elicit
        - setBody: {simple: "User response: action=${header.CamelAiToolElicitAction}, content=${body}"}
- route:
    from:
      uri: ai-tool:test_elicitation_sep1034_defaults
      parameters:
        description: Asks the user with defaults
        readOnlyHint: true
      steps:
        - setHeader:
            name: CamelAiToolElicitSchema
            constant: '{"type":"object","properties":{"name":{"type":"string","default":"John Doe"},"age":{"type":"integer","default":30},"score":{"type":"number","default":95.5},"status":{"type":"string","enum":["active","inactive","pending"],"default":"active"},"verified":{"type":"boolean","default":true}}}'
        - setBody: {constant: Please review your details}
        - to: ai-tool:current?operation=elicit
        - setBody: {simple: "Elicitation completed: action=${header.CamelAiToolElicitAction}, content=${body}"}
- route:
    from:
      uri: ai-tool:test_elicitation_sep1330_enums
      parameters:
        description: Asks the user with enums
        readOnlyHint: true
      steps:
        - setHeader:
            name: CamelAiToolElicitSchema
            constant: '{"type":"object","properties":{"untitledSingle":{"type":"string","enum":["option1","option2","option3"]},"titledSingle":{"type":"string","oneOf":[{"const":"value1","title":"First Option"},{"const":"value2","title":"Second Option"},{"const":"value3","title":"Third Option"}]},"legacyEnum":{"type":"string","enum":["opt1","opt2","opt3"],"enumNames":["Option One","Option Two","Option Three"]},"untitledMulti":{"type":"array","items":{"type":"string","enum":["option1","option2","option3"]}},"titledMulti":{"type":"array","items":{"anyOf":[{"const":"value1","title":"First Choice"},{"const":"value2","title":"Second Choice"},{"const":"value3","title":"Third Choice"}]}}}}'
        - setBody: {constant: Pick your options}
        - to: ai-tool:current?operation=elicit
        - setBody: {simple: "Elicitation completed: action=${header.CamelAiToolElicitAction}, content=${body}"}
