name: Container

# Publishes the Cameleer images for linux/amd64 and linux/arm64 to
#   docker.io/cameleering/cameleer   (when the DOCKERHUB_TOKEN secret is set)
#   ghcr.io/cameleering/cameleer
# in two distributions (docs/packs/index.md):
#   general: release tags (v1.2.3) publish 1.2.3, 1.2 and latest (pre-releases skip latest);
#            a manual run publishes edge
#   health:  the same build plus the health pack (FEATURES=full,health): 1.2.3-health,
#            1.2-health and health; a manual run publishes edge-health Each platform is built and tested before anything is pushed. The push
# carries an SBOM, max-mode provenance and a GitHub build attestation.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

env:
  # Image namespaces are explicit rather than taken from the repository owner, so a
  # repository transfer never moves them silently. DOCKERHUB_USERNAME is the account that
  # logs in (a repository variable, defaulting to the namespace's own account).
  GHCR_NAMESPACE: cameleering
  DOCKERHUB_NAMESPACE: cameleering
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'cameleering' }}
  HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - dist: general
            features: ""
            suffix: ""
            latest: auto
          - dist: health
            features: full,health
            suffix: "-health"
            latest: "false"
    env:
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reproducible timestamps from the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: images
        name: Target registries
        run: |
          {
            echo "list<<EOF"
            if [ "$HAS_DOCKERHUB" = "true" ]; then echo "docker.io/${DOCKERHUB_NAMESPACE}/cameleer"; fi
            echo "ghcr.io/${GHCR_NAMESPACE}/cameleer"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.images.outputs.list }}
          flavor: |
            latest=${{ matrix.latest }}
            suffix=${{ matrix.suffix }},onlatest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=health,suffix=,enable=${{ matrix.dist == 'health' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha
          labels: |
            org.opencontainers.image.title=Cameleer
            org.opencontainers.image.description=Apache Camel routes, rebuilt in Rust: one native binary, about 1 ms startup, about 10 MB of memory.
            org.opencontainers.image.url=https://cameleer.ing/
            org.opencontainers.image.documentation=https://github.com/cameleering/cameleer/blob/main/docs/DEPLOYMENT.md
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.title=Cameleer
            org.opencontainers.image.description=Apache Camel routes, rebuilt in Rust: one native binary, about 1 ms startup, about 10 MB of memory.
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and test each platform before pushing
        run: |
          for p in linux/amd64 linux/arm64; do
            echo "::group::$p"
            docker buildx build --platform "$p" --build-arg SOURCE_DATE_EPOCH --build-arg FEATURES="${{ matrix.features }}" --cache-from type=gha --load -t cameleer:test .
            docker run --rm --platform "$p" cameleer:test version
            if [ "${{ matrix.dist }}" = health ]; then docker run --rm --platform "$p" cameleer:test version | grep -q "+ health "; fi
            # read-only root filesystem, an arbitrary non-root user, a read-only route mount
            docker run -d --name smoke --platform "$p" --read-only --user 1000:1000 -p 18080:8080 \
              -v "$PWD/examples:/routes:ro" cameleer:test run /routes/hello-api.camel.yaml
            ok=
            for i in $(seq 1 60); do
              if curl -fsS localhost:18080/orders/42 | grep -q shipped; then ok=1; break; fi
              sleep 1
            done
            docker logs smoke
            docker rm -f smoke
            [ -n "$ok" ] || { echo "smoke test failed on $p"; exit 1; }
            echo "::endgroup::"
          done
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            FEATURES=${{ matrix.features }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          outputs: type=image,rewrite-timestamp=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.GHCR_NAMESPACE }}/cameleer
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - if: env.HAS_DOCKERHUB == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ env.DOCKERHUB_NAMESPACE }}/cameleer
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
