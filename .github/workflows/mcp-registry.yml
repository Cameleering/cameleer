name: MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io) with GitHub OIDC.
# The name io.github.Cameleering/cameleer (the registry compares the case of the organization name) belongs to the organization, so the publisher must prove it runs
# in a repository of that organization: the interactive `mcp-publisher login github` flow cannot read
# organization roles, OIDC does not need a token.
#
# Run it by hand after a release is on crates.io (the registry checks the published crate and its README
# line `mcp-name: io.github.Cameleering/cameleer`): Actions > MCP Registry > Run workflow, with the ref whose
# server.json is published (main by default, or a release tag).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag whose server.json is published"
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # the OIDC token the registry verifies
    env:
      PUBLISHER_VERSION: v1.8.9
      # SHA-256 of mcp-publisher_linux_amd64.tar.gz in registry_1.8.9_checksums.txt of that release
      PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Install mcp-publisher (checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Check server.json against the cameleer crate
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, re
          s = json.load(open("server.json"))
          want = re.search(r'^version = "([^"]+)"', open("publish/cameleer/Cargo.toml").read(), re.M).group(1)
          assert s["version"] == want, f"server.json says {s['version']}, the cameleer crate is {want}"
          assert all(p["version"] == want for p in s["packages"]), "a package version differs from the crate"
          print("server.json", s["name"], want)
          EOF
          ./mcp-publisher validate
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
